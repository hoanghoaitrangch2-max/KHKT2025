<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Human Teeth - 3D Model</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    .sketchfab-embed-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: transparent;
      z-index: 1;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      background: transparent;
      display: block;
    }

    /* =====================================
       NÚT LIÊN KẾT
       ===================================== */

    .external-tools {
      position: fixed;
      top: 70px;
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 99999;
    }

    .tool-button {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .tool-button:hover {
      transform: scale(1.08);
      background: #ffffff;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.25);
    }

    /* =====================================
       WIKIPEDIA
       ===================================== */

    .wikipedia-logo {
      width: 31px;
      height: 31px;
      object-fit: contain;
    }

    /* =====================================
       LOA
       ===================================== */

    .speaker-icon {
      width: 27px;
      height: 27px;
      fill: #111111;
    }

    /* =====================================
       YOUTUBE
       ===================================== */

    .youtube-icon {
      width: 30px;
      height: 30px;
      display: block;
    }

    .youtube-button:hover {
      transform: scale(1.10);
    }

    @supports (padding: env(safe-area-inset-top)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }

  </style>

</head>


<body>

  <script

  <script>

    const iframe =
      document.getElementById('api-frame');

    /* UID MỚI CỦA MÔ HÌNH RĂNG */

    const uid =
      '413bf84ae96847928dc984e40b8a0ea2';

    const client =
      new Sketchfab(iframe);

    client.init(uid, {

      success: function (api) {

        api.start();

        api.addEventListener(
          'viewerready',
          function () {

            console.log(
              '✅ 3D model "Teeth Denture gums and tongue cutted tooth" ready!'
            );

            /* =================================
               NỀN TRẮNG
               ================================= */

            api.setBackground(
              {
                color: [1, 1, 1],
                transparency: 0
              },
              function (err) {

                if (!err) {

                  console.log(
                    '🎨 Background set to white'
                  );

                }

              }
            );

          }
        );

      },

      error: function () {

        console.error(
          '❌ Sketchfab API initialization error'
        );

      }

    });
